# maintenance.conf - serves maintenance page via local maintenance server
server {
  listen 80;
  server_name dashboard.frynetworks.com;

  location / {
    proxy_pass http://127.0.0.1:8080;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
  }

  # keep a simple health check that still can be used by load balancer
  location = /health {
    proxy_pass http://127.0.0.1:8080/health || return 200 'ok';
  }
}
