<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1" />
    <title>Maintenance Ongoing</title>
    <style>
      :root{--bg:#000;--muted:#bfc5cc}
      html,body{height:100%;margin:0}
      body{background:var(--bg);color:#fff;font-family:Inter,system-ui,Segoe UI,Roboto,'Helvetica Neue',Arial,sans-serif}
  /* Header and logo */
  .header{position:fixed;inset:0 0 auto 0;height:96px;background:#000;display:flex;align-items:center;padding:0 20px;z-index:40}
  .logo{height:80px;width:auto;display:block}

  /* Hero sits below header */
  .hero{position:relative;width:100%;height:calc(60vh - 96px);min-height:260px;margin-top:96px;display:flex;align-items:center;justify-content:center;overflow:hidden}
      .hero::before{content:'';position:absolute;inset:0;background-image:url('/background.png');background-size:cover;background-position:center center;filter:brightness(0.45);z-index:1}
      .hero-inner{position:relative;z-index:2;max-width:1100px;padding:24px;text-align:center}
      .hero h1{font-size:2.25rem;margin:0}
      .hero p{color:var(--muted);margin-top:1rem}
      .meta{margin-top:1.25rem;color:var(--muted);font-size:0.95rem}
      @media(min-width:640px){
        .hero{height:70vh}
        .hero h1{font-size:3rem}
      }
    </style>
  </head>
  <body>
    <header class="header">
      <img class="logo" src="/Logo.png" alt="Logo" />
    </header>

    <section class="hero" role="main">
      <div class="hero-inner">
        <h1>Maintenance Ongoing</h1>
        <p>We're performing scheduled maintenance to improve our services. We'll be back shortly. Thanks for your patience.</p>
        <div class="meta">If you need support, join us on <a id="discord-link" href="https://discord.gg/frynetworks" target="_blank" rel="noopener noreferrer" style="color:#fff;text-decoration:underline">Discord</a></div>
      </div>
    </section>
  </body>
</html>
