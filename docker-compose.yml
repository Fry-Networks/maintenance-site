services:
  maintenance-site:
    image: node:22-alpine
    container_name: maintenance-site
    init: true
    restart: unless-stopped
    user: node
    working_dir: /app
    environment:
      PORT: "8080"
      MAINT_ROOT: /app
    command: ["node", "/app/server.js"]
    ports:
      - "127.0.0.1:${MAINTENANCE_HOST_PORT:-8080}:8080"
    read_only: true
    tmpfs:
      - /tmp
    volumes:
      - /home/helpdesk/subdomains/maintenance-site:/app:ro
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "5"
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "node -e \"require('http').get('http://127.0.0.1:8080/', r => process.exit(r.statusCode === 200 ? 0 : 1)).on('error', () => process.exit(1));\""
        ]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 5s
